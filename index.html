
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusiGo - Musique</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10101b;
      color: white;
    }

    header {
      background: #191927;
      padding: 20px;
      color: #24e6a0;
      font-size: 28px;
      font-weight: bold;
    }

    main {
      padding: 24px 18px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 25px;
      margin: 15px 0;
    }

    .music {
      background: #202033;
      padding: 25px 15px;
      border-radius: 18px;
      margin-top: 25px;
    }

    button {
      background: #24e6a0;
      border: 0;
      padding: 12px 22px;
      border-radius: 25px;
      font-weight: bold;
    }

    footer {
      padding: 25px;
      text-align: center;
      color: #aaa;
    }
  </style>
</head>
<body>
  <header>🎵 MusiGo</header>

  <main>
    <h1>Bienvenue sur MusiGo !</h1>
    <p>Découvrez votre univers musical.</p>

    <input type="search" placeholder="Rechercher une musique...">

    <section class="music">
      <h2>🎧 Votre musique</h2>
      <p>La musique commence ici !</p>
      <button onclick="alert('Bienvenue sur MusiGo !')">
        Découvrir
      </button>
    </section>
  </main>

  <footer>© 2026 MusiGo</footer>
</body>
</html>
